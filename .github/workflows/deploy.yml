name: Publicar en GitHub Pages

# Se ejecuta cada vez que subes cambios a la rama principal
on:
  push:
    branches: [main, master]
  workflow_dispatch: # permite lanzarlo a mano desde la pestaña "Actions"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Comprobar estructura de archivos
        run: |
          # Si los archivos quedaron dentro de una subcarpeta (ej. al arrastrar la carpeta a GitHub)
          if [ ! -f package.json ]; then
            echo "package.json no está en la raíz. Buscando en subcarpetas..."
            SUBDIR=$(find . -maxdepth 2 -name package.json -not -path "./node_modules/*" | head -n 1)
            if [ -n "$SUBDIR" ]; then
              DIR=$(dirname "$SUBDIR")
              echo "Encontrado en $DIR. Moviendo archivos a la raíz..."
              shopt -s dotglob
              mv "$DIR"/* .
              rmdir "$DIR" 2>/dev/null || true
            else
              echo "ERROR: No se encontró package.json en el repositorio."
              ls -la
              exit 1
            fi
          fi
          echo "Archivos listos para compilar:"
          ls -la

      - name: Comprobar que están todos los archivos
        run: |
          FALTAN=0
          for f in index.html package.json vite.config.ts tsconfig.json \
                   src/main.tsx src/App.tsx src/index.css \
                   src/data/memories.ts src/data/store.ts \
                   src/components/Sphere.tsx src/components/Editor.tsx \
                   src/components/MemoryExperience.tsx src/components/PrintSheets.tsx \
                   src/games/common.tsx src/games/registry.tsx \
                   src/games/set1.tsx src/games/set2.tsx src/games/set3.tsx; do
            if [ ! -f "$f" ]; then
              echo "::error::FALTA EL ARCHIVO: $f"
              FALTAN=1
            fi
          done
          if [ "$FALTAN" = "1" ]; then
            echo ""
            echo "Contenido actual del repositorio:"
            find . -path ./node_modules -prune -o -path ./.git -prune -o -type f -print | sort
            echo ""
            echo "Sube los archivos que faltan respetando sus carpetas (src/, src/data/, src/components/, src/games/)."
            exit 1
          fi
          echo "Todos los archivos necesarios están presentes."

      - name: Instalar dependencias
        run: npm install --legacy-peer-deps

      - name: Compilar la web
        run: npm run build

      - name: Verificar compilación
        run: |
          if [ ! -f dist/index.html ]; then
            echo "ERROR: dist/index.html no fue generado."
            exit 1
          fi

      - name: Preparar artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 300000
          error_count: 5
