name: Publicar en GitHub Pages

# Se ejecuta cada vez que subes cambios a la rama principal
on:
  push:
    branches: [main, master]
  workflow_dispatch: # permite lanzarlo a mano desde la pestaña "Actions"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Comprobar estructura de archivos
        run: |
          # Si los archivos quedaron dentro de una subcarpeta (ej. al arrastrar la carpeta a GitHub)
          if [ ! -f package.json ]; then
            echo "package.json no está en la raíz. Buscando en subcarpetas..."
            SUBDIR=$(find . -maxdepth 2 -name package.json -not -path "./node_modules/*" | head -n 1)
            if [ -n "$SUBDIR" ]; then
              DIR=$(dirname "$SUBDIR")
              echo "Encontrado en $DIR. Moviendo archivos a la raíz..."
              shopt -s dotglob
              mv "$DIR"/* .
              rmdir "$DIR" 2>/dev/null || true
            else
              echo "ERROR: No se encontró package.json en el repositorio."
              ls -la
              exit 1
            fi
          fi
          echo "Archivos listos para compilar:"
          ls -la

      - name: Instalar dependencias
        run: npm install --legacy-peer-deps

      - name: Compilar la web
        run: npm run build

      - name: Verificar compilación
        run: |
          if [ ! -f dist/index.html ]; then
            echo "ERROR: dist/index.html no fue generado."
            exit 1
          fi

      - name: Preparar artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
